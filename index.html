<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Library Manager</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f9fafb;color:#111827}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.hdr{background:#4f46e5;color:#fff;padding:14px 16px 18px;border-radius:0 0 24px 24px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hrow h1{font-size:18px;margin:0}
.chip{background:#6366f1;border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
.mnav{display:flex;justify-content:space-between;align-items:center;background:#6366f1;border-radius:12px;padding:4px 8px;margin-top:12px}
.mnav button{background:none;border:0;color:#fff;font-size:22px;padding:2px 10px}
.mnav b{font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.15);border-radius:12px;padding:10px}
.stat small{opacity:.8;font-size:12px;display:block}
.stat b{font-size:20px}
.pad{padding:0 16px;margin-top:14px}
.alert{display:block;width:100%;text-align:left;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.filters{display:flex;gap:6px;margin:12px 0}
.filters button{flex:1;padding:7px 0;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-size:12px;color:#4b5563}
.filters button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:12px;margin-bottom:8px}
.seatbox{width:44px;height:44px;border-radius:10px;background:#eef2ff;color:#4338ca;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.seatbox small{font-size:9px}.seatbox b{line-height:1}
.grow{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#6b7280}
.red{color:#dc2626}.amber{color:#d97706}.green{color:#15803d}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px}
.pill.p{background:#dcfce7;color:#15803d}.pill.u{background:#fee2e2;color:#dc2626}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbtn{aspect-ratio:1;border:0;border-radius:10px;font-weight:700;font-size:14px}
.sbtn.paid{background:#22c55e;color:#fff}.sbtn.unpaid{background:#ef4444;color:#fff}.sbtn.vacant{background:#e5e7eb;color:#4b5563}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:#6b7280;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:#4f46e5;font-weight:600}
.fab{position:fixed;right:16px;bottom:78px;width:56px;height:56px;border-radius:50%;border:0;background:#4f46e5;color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:600;margin-top:8px}
.btn.pri{background:#4f46e5;color:#fff;border-color:#4f46e5}
.btn.ok{background:#16a34a;color:#fff;border-color:#16a34a}
.btn.wa{border-color:#16a34a;color:#15803d;text-decoration:none;display:block;text-align:center}
.btn.del{border-color:#fecaca;color:#dc2626}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow-y:auto}
.sheet h2{margin:0 0 4px;font-size:18px}
.close{float:right;background:none;border:0;font-size:24px}
.box{background:#f9fafb;border:1px solid #f3f4f6;border-radius:16px;padding:12px;margin-top:12px}
.field{margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#dc2626;font-size:14px;margin-top:8px}
.hist{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #f3f4f6}
.login{min-height:100vh;background:#4f46e5;display:flex;align-items:center;padding:20px}
.lcard{background:#fff;border-radius:24px;padding:20px;width:100%}
.lcard h1{margin:0 0 12px;font-size:20px}.lcard input{margin-bottom:10px}
.muted{text-align:center;color:#9ca3af;font-size:13px;padding:30px 0}
label{font-size:12px;color:#6b7280}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, addDoc, setDoc, updateDoc, deleteDoc, deleteField, FieldPath } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfCeAJvkEhfxLgRFk4F7F1WKXwcPTzNcM",
  authDomain: "theeta-library.firebaseapp.com",
  projectId: "theeta-library",
  storageBucket: "theeta-library.firebasestorage.app",
  messagingSenderId: "695333412662",
  appId: "1:695333412662:web:d34fb359f88958fe621d97"
};
// Abhi sab log staff hain. Malik ka email baad me yahan likhna (aur Rules me bhi).
const OWNER_EMAIL = "malik-baad-me@example.com";

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

// Home screen app support
try {
  const icon = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4f46e5"/><text x="50" y="68" font-size="58" text-anchor="middle">📚</text></svg>');
  const m = { name: "Library Manager", short_name: "Library", start_url: location.href, display: "standalone", background_color: "#4f46e5", theme_color: "#4f46e5", icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }] };
  const l = document.createElement("link");
  l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  document.head.appendChild(l);
} catch (e) {}

const SHIFTS = ["Full Day", "Morning", "Afternoon", "Evening", "Night"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const todayStr = () => { const d = new Date(); return `${ymOf(d)}-${String(d.getDate()).padStart(2, "0")}`; };
const labelOf = (ym) => { const [y, m] = ym.split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const shiftYm = (ym, n) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + n, 1)); };
const pd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const conflict = (a, b) => a.seat === b.seat && (a.shift === "Full Day" || b.shift === "Full Day" || a.shift === b.shift);

const cycleStart = (join, ym) => {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, Math.min(pd(join).getDate(), new Date(y, m, 0).getDate()));
};
const expiryOf = (s) => {
  const keys = Object.keys(s.payments || {}).sort();
  if (!keys.length) return null;
  const e = cycleStart(s.joinDate, shiftYm(keys[keys.length - 1], 1));
  e.setDate(e.getDate() - 1);
  return e;
};
const expStatus = (s) => {
  const e = expiryOf(s);
  if (!e) return { k: "new", label: "Fees abhi tak nahi di", days: -999 };
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((e - t) / 86400000);
  if (days < 0) return { k: "expired", label: `${fmt(e)} ko expire (${-days} din pehle)`, days };
  if (days === 0) return { k: "soon", label: "Aaj expire ho rahi hai", days };
  if (days <= 3) return { k: "soon", label: `${fmt(e)} tak (${days} din baaki)`, days };
  return { k: "ok", label: `${fmt(e)} tak valid`, days };
};

let user = null, students = [], totalSeats = 50;
let month = ymOf(new Date()), tab = "students", filter = "all", q = "", detailId = null, formOpen = false;
let unsubS = null, unsubC = null;

const isOwner = () => user && user.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
const myName = () => (user ? user.email.split("@")[0] : "");
const isPaid = (s) => !!(s.payments && s.payments[month]);
const activeList = () => students.filter((s) => s.joinDate.slice(0, 7) <= month);
const alertList = () => students.filter((s) => ["soon", "expired"].includes(expStatus(s).k));

function renderLogin() {
  $("app").innerHTML = `<div class="login"><div class="lcard">
    <h1>📚 Library Manager</h1>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div id="lerr" class="err"></div>
    <button class="btn pri" onclick="A.login()">Login</button>
  </div></div>`;
}

function renderShell() {
  $("app").innerHTML = `<div id="top"></div><div id="content"></div>
  <button class="fab" onclick="A.openForm()">+</button>
  <nav>
    <button data-t="students" onclick="A.setTab('students')"><span>👥</span>Students</button>
    <button data-t="seats" onclick="A.setTab('seats')"><span>💺</span>Seats</button>
    <button data-t="history" onclick="A.setTab('history')"><span>🗓️</span>History</button>
    <button data-t="more" onclick="A.setTab('more')"><span>⚙️</span>More</button>
  </nav>`;
  renderTop(); renderContent();
}

function renderTop() {
  if (!$("top")) return;
  const act = activeList();
  const paid = act.filter(isPaid), unpaid = act.filter((s) => !isPaid(s));
  const collected = paid.reduce((t, s) => t + (+s.payments[month].amt || 0), 0);
  const pending = unpaid.reduce((t, s) => t + (+s.fee || 0), 0);
  $("top").innerHTML = `<div class="hdr">
    <div class="hrow"><h1>📚 Library Manager</h1>
      <div><span class="chip">${esc(myName())}</span> <button class="chip" onclick="A.logout()">Logout</button></div></div>
    <div class="mnav"><button onclick="A.month(-1)">‹</button><b>${labelOf(month)}</b><button onclick="A.month(1)">›</button></div>
    <div class="stats">
      <div class="stat"><small>Mili hui fees</small><b>₹${collected}</b><small>${paid.length} students</small></div>
      <div class="stat"><small>Baaki fees</small><b>₹${pending}</b><small>${unpaid.length} students</small></div>
    </div></div>`;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
}

function itemHtml(s) {
  const es = expStatus(s);
  const col = es.k === "expired" || es.k === "new" ? "red" : es.k === "soon" ? "amber" : "";
  return `<button class="item" onclick="A.detail('${s.id}')">
    <div class="seatbox"><small>SEAT</small><b>${s.seat}</b></div>
    <div class="grow"><div class="nm">${esc(s.name)}</div>
      <div class="sub">${esc(s.shift)} • ₹${s.fee}/month</div>
      <div class="sub ${col}">${es.label}</div></div>
    <span class="pill ${isPaid(s) ? "p" : "u"}">${isPaid(s) ? "Paid ✓" : "Baaki"}</span></button>`;
}

function getList() {
  const t = q.trim().toLowerCase();
  let arr = filter === "expiring" ? alertList() : activeList();
  arr = arr.filter((s) => (filter === "paid" ? isPaid(s) : filter === "unpaid" ? !isPaid(s) : true))
    .filter((s) => !t || s.name.toLowerCase().includes(t) || (s.phone || "").includes(t) || String(s.seat) === t);
  return [...arr].sort((a, b) => filter === "expiring" ? expStatus(a).days - expStatus(b).days : a.seat - b.seat);
}

function renderList() {
  const el = $("list"); if (!el) return;
  const arr = getList();
  el.innerHTML = arr.length ? arr.map(itemHtml).join("") :
    `<div class="muted">${students.length ? "Koi student nahi mila." : "Abhi koi student nahi hai. + button se pehla student add karo."}</div>`;
}

function seatState(n) {
  const on = activeList().filter((s) => s.seat === n);
  if (!on.length) return "vacant";
  return on.every(isPaid) ? "paid" : "unpaid";
}

function renderContent() {
  const c = $("content"); if (!c) return;
  if (tab === "students") {
    const al = alertList();
    c.innerHTML = `<div class="pad">
      ${al.length ? `<button class="alert" onclick="A.setFilter('expiring')">⚠️ <b>${al.length} students</b> ki fees expire ho rahi hai ya ho chuki hai. Dekhne ke liye tap karo.</button>` : ""}
      <input id="q" placeholder="Naam / phone / seat no. search karo" value="${esc(q)}" oninput="A.search(this.value)">
      <div class="filters">${[["all", "Sab"], ["unpaid", "Baaki"], ["paid", "Paid"], ["expiring", "⚠ Expiry"]]
        .map(([k, l]) => `<button class="${filter === k ? "on" : ""}" onclick="A.setFilter('${k}')">${l}</button>`).join("")}</div>
      <div id="list"></div></div>`;
    renderList();
  } else if (tab === "seats") {
    const seats = Array.from({ length: totalSeats }, (_, i) => i + 1);
    const vac = seats.filter((n) => seatState(n) === "vacant").length;
    c.innerHTML = `<div class="pad">
      <div class="sub" style="margin-bottom:10px">🟩 Paid &nbsp; 🟥 Baaki &nbsp; ⬜ Khali</div>
      <div class="grid">${seats.map((n) => `<button class="sbtn ${seatState(n)}" onclick="A.seat(${n})">${n}</button>`).join("")}</div>
      <div class="muted">Khali seat pe tap = naya student. Bhari seat pe tap = details.<br>Khali seats: ${vac} / ${totalSeats}</div></div>`;
  } else if (tab === "history") {
    const map = {};
    students.forEach((s) => Object.entries(s.payments || {}).forEach(([m, p]) => {
      map[m] = map[m] || { m, n: 0, amt: 0 }; map[m].n++; map[m].amt += +p.amt || 0;
    }));
    const rows = Object.values(map).sort((a, b) => b.m.localeCompare(a.m));
    c.innerHTML = `<div class="pad"><b>Mahine-wise collection</b><div style="margin-top:10px">
      ${rows.length ? rows.map((r) => `<button class="item" onclick="A.goMonth('${r.m}')">
        <div class="grow"><div class="nm">${labelOf(r.m)}</div><div class="sub">${r.n} students ne fees di</div></div>
        <b class="green">₹${r.amt}</b></button>`).join("") : `<div class="muted">Abhi koi payment record nahi hai.</div>`}
      </div><div class="muted">Mahine pe tap karke us mahine ki poori list dekho.</div></div>`;
  } else {
    c.innerHTML = `<div class="pad">
      <div class="box" style="margin-top:0"><b>Download</b>
        <button class="btn" onclick="A.csv()">⬇ ${labelOf(month)} ki Excel/CSV</button></div>
      ${isOwner() ? `<div class="box"><b>Total seats</b>
        <input type="number" value="${totalSeats}" onchange="A.setSeats(this.value)" style="margin-top:8px"></div>` : ""}
      <div class="muted">Login: ${esc(user.email)} (${isOwner() ? "Malik" : "Staff"})<br>Data sab devices pe live sync hota hai.</div></div>`;
  }
}

function waLink(s) {
  const ph = (s.phone || "").replace(/\D/g, "");
  const e = expiryOf(s);
  const t = expStatus(s).k !== "ok" && e
    ? `Namaste ${s.name}, aapki library ki fees ${fmt(e)} ko expire ho rahi hai/ho chuki hai (Seat ${s.seat}, Rs.${s.fee}). Kripya renew karein. Dhanyawad.`
    : `Namaste ${s.name}, aapki library ki ${labelOf(month)} ki fees Rs.${s.fee} baaki hai (Seat ${s.seat}). Kripya jaldi jama karein. Dhanyawad.`;
  return `https://wa.me/${ph.length === 10 ? "91" + ph : ph}?text=${encodeURIComponent(t)}`;
}

function renderDetail() {
  const s = students.find((x) => x.id === detailId);
  if (!s) { $("modal").innerHTML = ""; detailId = null; return; }
  const es = expStatus(s);
  const p = s.payments && s.payments[month];
  const hist = Object.keys(s.payments || {}).sort().reverse();
  $("modal").innerHTML = `<div class="overlay"><div class="sheet">
    <button class="close" onclick="A.closeModal()">×</button>
    <h2>${esc(s.name)}</h2>
    <div class="sub">Seat ${s.seat} • ${esc(s.shift)} • ₹${s.fee}/month</div>
    ${s.phone ? `<div class="sub">📞 ${esc(s.phone)}</div>` : ""}
    <div class="sub">Joined: ${s.joinDate}</div>
    <div class="${es.k === "ok" ? "green" : "red"}" style="font-size:14px;font-weight:600;margin-top:4px">Expiry: ${es.label}</div>
    <div class="box"><b style="font-size:14px">${labelOf(month)} ki fees</b>
      ${p ? `<div class="green" style="font-weight:600;margin-top:6px">✓ ₹${p.amt} mil gaye</div>
        <div class="sub">${esc(p.mode)} • ${p.date}${p.by ? ` • ${esc(p.by)} ne liya` : ""}</div>
        <button class="btn del" onclick="A.undo('${s.id}')">Galti se mark hui? Wapas baaki karo</button>`
      : `<div class="two field"><input id="pamt" type="number" value="${s.fee}">
          <select id="pmode"><option>Cash</option><option>UPI</option><option>Other</option></select></div>
         <button class="btn ok" onclick="A.pay('${s.id}')">✓ Fees mil gayi</button>`}
      ${s.phone ? `<a class="btn wa" href="${waLink(s)}" target="_blank" rel="noreferrer">💬 WhatsApp reminder bhejo</a>` : ""}
    </div>
    <div style="margin-top:14px"><b style="font-size:14px">Payment history</b>
      ${hist.length ? hist.map((m) => `<div class="hist"><span>${labelOf(m)}</span><span class="sub">₹${s.payments[m].amt} • ${esc(s.payments[m].mode)} • ${s.payments[m].date}</span></div>`).join("") : `<div class="sub">Abhi koi payment nahi.</div>`}
    </div>
    <div class="two" style="margin-top:6px"><button class="btn" onclick="A.openForm('','${s.id}')">✏️ Edit</button>
      ${isOwner() ? `<button class="btn del" onclick="A.remove('${s.id}')">🗑 Hatao</button>` : "<span></span>"}</div>
  </div></div>`;
}

function renderForm(seat, id) {
  const s = id ? students.find((x) => x.id === id) : null;
  formOpen = true;
  $("modal").innerHTML = `<div class="overlay"><div class="sheet">
    <button class="close" onclick="A.closeModal()">×</button>
    <h2>${s ? "Student edit karo" : "Naya student"}</h2>
    <div class="field"><input id="fn" placeholder="Naam" value="${esc(s ? s.name : "")}"></div>
    <div class="field"><input id="fp" placeholder="Phone number" inputmode="numeric" value="${esc(s ? s.phone : "")}"></div>
    <div class="two field"><input id="fs" type="number" placeholder="Seat no." value="${s ? s.seat : seat || ""}">
      <input id="ff" type="number" placeholder="Monthly fees ₹" value="${s ? s.fee : ""}"></div>
    <div class="field"><select id="fh">${SHIFTS.map((x) => `<option ${s && s.shift === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label>Joining date (isi din se har mahine ki fees cycle chalegi)</label>
      <input id="fd" type="date" value="${s ? s.joinDate : todayStr()}"></div>
    <div id="ferr" class="err"></div>
    <button class="btn pri" onclick="A.save('${id || ""}')">Save karo</button>
  </div></div>`;
}

function refreshUI() {
  if (!user) return;
  renderTop();
  if (document.activeElement && document.activeElement.id === "q") renderList();
  else renderContent();
  if (detailId && !formOpen) renderDetail();
}

const A = {
  login: async () => {
    try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
    catch (e) { $("lerr").textContent = "Email ya password galat hai"; }
  },
  logout: () => signOut(auth),
  setTab: (t) => { tab = t; if (t === "students") q = ""; renderTop(); renderContent(); },
  month: (n) => { month = shiftYm(month, n); refreshUI(); },
  goMonth: (m) => { month = m; filter = "all"; tab = "students"; renderTop(); renderContent(); },
  setFilter: (f) => { filter = f; tab = "students"; renderTop(); renderContent(); },
  search: (v) => { q = v; renderList(); },
  seat: (n) => {
    if (seatState(n) === "vacant") A.openForm(n);
    else { q = String(n); filter = "all"; tab = "students"; renderTop(); renderContent(); }
  },
  detail: (id) => { detailId = id; formOpen = false; renderDetail(); },
  closeModal: () => { $("modal").innerHTML = ""; detailId = null; formOpen = false; },
  openForm: (seat, id) => renderForm(seat, id),
  save: async (id) => {
    const f = { name: $("fn").value.trim(), phone: $("fp").value.trim(), seat: +$("fs").value, fee: +$("ff").value, shift: $("fh").value, joinDate: $("fd").value };
    const err = (m) => { $("ferr").textContent = m; };
    if (!f.name) return err("Naam likho");
    if (!f.seat || f.seat < 1 || f.seat > totalSeats) return err(`Seat 1 se ${totalSeats} ke beech honi chahiye`);
    if (!f.fee) return err("Fees likho");
    if (!f.joinDate) return err("Joining date chuno");
    const clash = students.find((s) => s.id !== id && conflict(s, f));
    if (clash) return err(`Seat ${f.seat} (${clash.shift}) pe ${clash.name} pehle se hai`);
    try {
      if (id) await updateDoc(doc(db, "students", id), f);
      else await addDoc(collection(db, "students"), { ...f, payments: {} });
      A.closeModal();
    } catch (e) { err("Save nahi hua. Internet check karo."); }
  },
  pay: async (id) => {
    const s = students.find((x) => x.id === id);
    const amt = +$("pamt").value || +s.fee;
    await updateDoc(doc(db, "students", id), new FieldPath("payments", month), { amt, mode: $("pmode").value, date: todayStr(), by: myName() });
    A.closeModal();
  },
  undo: async (id) => {
    await updateDoc(doc(db, "students", id), new FieldPath("payments", month), deleteField());
    A.closeModal();
  },
  remove: async (id) => {
    if (!confirm("Pakka is student ko hatana hai? Uska poora record chala jayega.")) return;
    await deleteDoc(doc(db, "students", id));
    A.closeModal();
  },
  setSeats: async (v) => { await setDoc(doc(db, "settings", "main"), { totalSeats: Math.max(1, +v || 1) }); },
  csv: () => {
    const rows = [["Seat", "Naam", "Phone", "Shift", "Fees", "Month", "Status", "Amount", "Mode", "Date", "Liya", "Expiry"]];
    [...activeList()].sort((a, b) => a.seat - b.seat).forEach((s) => {
      const p = s.payments && s.payments[month], e = expiryOf(s);
      rows.push([s.seat, s.name, s.phone, s.shift, s.fee, labelOf(month), p ? "Paid" : "Baaki", p ? p.amt : "", p ? p.mode : "", p ? p.date : "", p ? p.by || "" : "", e ? fmt(e) : ""]);
    });
    const csv = rows.map((r) => r.map((c) => `"${c ?? ""}"`).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
    a.download = `library-${month}.csv`; a.click();
  }
};
window.A = A;

onAuthStateChanged(auth, (u) => {
  user = u;
  if (unsubS) { unsubS(); unsubS = null; }
  if (unsubC) { unsubC(); unsubC = null; }
  $("modal").innerHTML = "";
  if (!u) { students = []; renderLogin(); return; }
  renderShell();
  unsubS = onSnapshot(collection(db, "students"), (snap) => {
    students = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    refreshUI();
  });
  unsubC = onSnapshot(doc(db, "settings", "main"), (s) => {
    if (s.exists()) totalSeats = s.data().totalSeats || 50;
    refreshUI();
  });
});
</script>
</body>
</html>
