<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Library Manager</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f9fafb;color:#111827}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.hdr{background:#4f46e5;color:#fff;padding:14px 16px 18px;border-radius:0 0 24px 24px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hrow h1{font-size:18px;margin:0}
.chip{background:#6366f1;border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
.mnav{display:flex;justify-content:space-between;align-items:center;background:#6366f1;border-radius:12px;padding:4px 8px;margin-top:12px}
.mnav button{background:none;border:0;color:#fff;font-size:22px;padding:2px 10px}
.mnav b{font-size:15px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:rgba(255,255,255,.15);border-radius:12px;padding:10px}
.stat small{opacity:.8;font-size:12px;display:block}
.stat b{font-size:20px}
.pad{padding:0 16px;margin-top:14px}
.alert{display:block;width:100%;text-align:left;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.filters{display:flex;gap:6px;margin:12px 0}
.filters button{flex:1;padding:7px 0;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-size:11px;color:#4b5563}
.filters button.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:12px;margin-bottom:8px}
.seatbox{width:44px;height:44px;border-radius:10px;background:#eef2ff;color:#4338ca;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.seatbox small{font-size:9px}.seatbox b{line-height:1}
.grow{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#6b7280}
.red{color:#dc2626}.amber{color:#d97706}.green{color:#15803d}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px}
.pill.p{background:#dcfce7;color:#15803d}.pill.u{background:#fee2e2;color:#dc2626}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sbtn{min-height:58px;border:0;border-radius:10px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.25;overflow:hidden}
.sbtn small{font-size:10px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:12px}
.sbtn.paid{background:#22c55e;color:#fff}.sbtn.unpaid{background:#ef4444;color:#fff}.sbtn.vacant{background:#e5e7eb;color:#4b5563}
nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1px solid #e5e7eb;display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:#6b7280;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:#4f46e5;font-weight:600}
.fab{position:fixed;right:16px;bottom:78px;width:56px;height:56px;border-radius:50%;border:0;background:#4f46e5;color:#fff;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.btn{width:100%;padding:12px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-weight:600;margin-top:8px}
.btn.pri{background:#4f46e5;color:#fff;border-color:#4f46e5}
.btn.ok{background:#16a34a;color:#fff;border-color:#16a34a}
.btn.sm{width:auto;padding:6px 12px;font-size:13px;margin-top:4px}
.btn.wa{border-color:#16a34a;color:#15803d;text-decoration:none;display:block;text-align:center}
.btn.del{border-color:#fecaca;color:#dc2626}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow-y:auto}
.sheet h2{margin:0 0 4px;font-size:18px}
.close{float:right;background:none;border:0;font-size:24px}
.box{background:#f9fafb;border:1px solid #f3f4f6;border-radius:16px;padding:12px;margin-top:12px}
.field{margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#dc2626;font-size:14px;margin-top:8px}
.hist{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 10px;font-size:13px;padding:5px 0;border-bottom:1px solid #f3f4f6}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}
.big{font-size:22px}
.login{min-height:100vh;background:#4f46e5;display:flex;align-items:center;padding:20px}
.lcard{background:#fff;border-radius:24px;padding:20px;width:100%}
.lcard h1{margin:0 0 12px;font-size:20px}.lcard input{margin-bottom:10px}
.muted{text-align:center;color:#9ca3af;font-size:13px;padding:30px 0}
label{font-size:12px;color:#6b7280}
.av{position:relative;width:48px;height:48px;flex-shrink:0}
.ph{border-radius:50%;object-fit:cover;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:700}
.av .ph{width:48px;height:48px;font-size:18px}
.av .sb{position:absolute;right:-6px;bottom:-4px;background:#4f46e5;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 6px;border:2px solid #fff;line-height:1.3}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border:1px solid #f3f4f6;border-radius:14px;padding:12px;text-align:left;width:100%}
.card small{color:#6b7280;font-size:12px;display:block}
.card b{font-size:22px;display:block;margin-top:2px}
.subh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
.pill.l{background:#f3f4f6;color:#6b7280}
.sbanner{background:#f0fdf4;border:1px solid #86efac;border-radius:14px;padding:12px;margin-top:12px}
#zoom .overlay{z-index:70;align-items:center;background:rgba(0,0,0,.85)}
#zoom img{max-width:94vw;max-height:88vh;border-radius:16px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="zoom"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, onSnapshot, doc, addDoc, setDoc, updateDoc, deleteDoc, deleteField, FieldPath } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBfCeAJvkEhfxLgRFk4F7F1WKXwcPTzNcM",
  authDomain: "theeta-library.firebaseapp.com",
  projectId: "theeta-library",
  storageBucket: "theeta-library.firebasestorage.app",
  messagingSenderId: "695333412662",
  appId: "1:695333412662:web:d34fb359f88958fe621d97"
};
// Abhi sab log staff hain. Malik ka email baad me yahan likhna (aur Rules me bhi).
const OWNER_EMAIL = "malik-baad-me@example.com";

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

// Home screen app support
try {
  const icon = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4f46e5"/><text x="50" y="68" font-size="58" text-anchor="middle">📚</text></svg>');
  const m = { name: "Library Manager", short_name: "Library", start_url: location.href, display: "standalone", background_color: "#4f46e5", theme_color: "#4f46e5", icons: [{ src: icon, sizes: "512x512", type: "image/svg+xml", purpose: "any" }] };
  const l = document.createElement("link");
  l.rel = "manifest";
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/manifest+json" }));
  document.head.appendChild(l);
} catch (e) {}

const SHIFTS = ["Full Day", "Morning", "Afternoon", "Evening", "Night"];
const CATS = ["Water", "Electricity", "Rent", "Salary", "Internet", "Cleaning", "Repair", "Stationery", "Tea/Snacks", "Other"];
const LEGACY = { Pani: "Water", Bijli: "Electricity", Kiraya: "Rent", Safai: "Cleaning", "Chai/Nashta": "Tea/Snacks" };
const catEn = (c) => LEGACY[c] || c;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ymOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const todayStr = () => { const d = new Date(); return `${ymOf(d)}-${String(d.getDate()).padStart(2, "0")}`; };
const labelOf = (ym) => { const [y, m] = ym.split("-"); return `${MONTHS[+m - 1]} ${y}`; };
const shiftYm = (ym, n) => { const [y, m] = ym.split("-").map(Number); return ymOf(new Date(y, m - 1 + n, 1)); };
const pd = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const HMONTHS = ["जनवरी","फ़रवरी","मार्च","अप्रैल","मई","जून","जुलाई","अगस्त","सितंबर","अक्टूबर","नवंबर","दिसंबर"];
const fmtY = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
const fmtHi = (d) => `${d.getDate()} ${HMONTHS[d.getMonth()]} ${d.getFullYear()}`;
const LIB = "Theeta Library", LIB_HI = "थीटा लाइब्रेरी";
const avatar = (s, size) => {
  const st = size ? `width:${size}px;height:${size}px;font-size:${Math.round(size / 2.6)}px` : "";
  return s.photo
    ? `<img class="ph" style="${st}" src="${s.photo}" alt="">`
    : `<div class="ph" style="${st}">${esc((s.name || "?").trim().charAt(0).toUpperCase())}</div>`;
};
const maskAad = (a) => "•••• •••• " + String(a).slice(-4);
const fullAad = (a) => String(a).replace(/(\d{4})(?=\d)/g, "$1 ");
const shrink = (file) => new Promise((res, rej) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    const r = Math.min(1, 360 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    res(c.toDataURL("image/jpeg", 0.72));
  };
  img.onerror = rej;
  img.src = url;
});
const dn = (n) => `${n} day${n === 1 ? "" : "s"}`;
const rs = (n) => "₹" + Math.round(+n || 0).toLocaleString("en-IN");

// seat 0 (ya khali) = unreserved student
const isRes = (s) => +s.seat > 0;
const seatText = (s) => (isRes(s) ? `Seat ${s.seat}` : "Unreserved");
const conflict = (a, b) => +a.seat > 0 && a.seat === b.seat && (a.shift === "Full Day" || b.shift === "Full Day" || a.shift === b.shift);

const cycleStart = (join, ym) => {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m - 1, Math.min(pd(join).getDate(), new Date(y, m, 0).getDate()));
};
// Expiry = the end date of the latest payment (see entriesOf / planPay below)
const expiryOf = (s) => { const e = entriesOf(s); return e.length ? e[e.length - 1].until : null; };
const expStatus = (s) => {
  const e = expiryOf(s);
  if (!e) return { k: "new", label: "No fees paid yet", days: -999 };
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const days = Math.round((e - t) / 86400000);
  if (days < 0) return { k: "expired", label: `Expiry: ${fmtY(e)} (expired ${dn(-days)} ago)`, days };
  if (days === 0) return { k: "soon", label: `Expiry: ${fmtY(e)} (expires today)`, days };
  if (days <= 3) return { k: "soon", label: `Expiry: ${fmtY(e)} (${dn(days)} left)`, days };
  return { k: "ok", label: `Expiry: ${fmtY(e)} (${dn(days)} left)`, days };
};

// ---- Fees logic ----
// Every payment covers a period [from, until). Paying on time continues from the old expiry (no days lost).
// Paying late (or the first payment) starts from the payment date, e.g. due on the 30th, paid & marked on the 3rd -> next expiry is the 3rd.
// Old records (stored per month in "payments") are still read; new ones are saved in "pays".
const ymd = (d) => `${ymOf(d)}-${String(d.getDate()).padStart(2, "0")}`;
const today0 = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const addM = (d, n, day) => {
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(day, new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
  return t;
};
const entriesOf = (s) => {
  const jd = pd(s.joinDate).getDate();
  const old = Object.entries(s.payments || {}).filter(([, p]) => !p.covered).map(([k, p]) => {
    const n = p.months || 1;
    return { id: "L" + k, legacy: true, k, n, from: cycleStart(s.joinDate, k), until: cycleStart(s.joinDate, shiftYm(k, n)), day: jd, amt: p.amt, mode: p.mode, date: p.date, by: p.by };
  });
  const nw = (s.pays || []).map((p) => ({ ...p, legacy: false, n: p.months || 1, from: pd(p.from), until: pd(p.until) }));
  return [...old, ...nw].sort((a, b) => a.until - b.until || String(a.date).localeCompare(String(b.date)));
};
const planPay = (s, n, dateStr) => {
  // The cycle ALWAYS follows the admission day (e.g. admitted on the 21st -> 21st to 21st), whenever you mark the payment.
  const jd = pd(s.joinDate).getDate(), d = pd(dateStr);
  const ents = entriesOf(s), last = ents[ents.length - 1];
  let cs = addM(d, 0, jd);                 // start of the admission-day cycle that contains the payment date
  if (cs > d) cs = addM(d, -1, jd);
  const jn = pd(s.joinDate);
  if (cs < jn) cs = jn;
  const from = last && last.until > cs ? last.until : cs;   // paid early/on time: continue from old expiry
  return { from, day: jd, n, until: addM(from, n, jd) };
};
const planText = (pl) => `${fmt(pl.from)} → ${fmtY(pl.until)}`;
const payMonth = (e) => (e.date || "").slice(0, 7) || ymOf(e.from);

let user = null, students = [], expenses = [], expErr = false, totalSeats = 100, formPhoto = "";
let month = ymOf(new Date()), tab = "home", filter = "all", q = "", detailId = null, formOpen = false;
let attDate = todayStr(), aq = "", flash = null;
let unsubS = null, unsubC = null, unsubE = null;

const isOwner = () => user && user.email.toLowerCase() === OWNER_EMAIL.toLowerCase();
const myName = () => (user ? user.email.split("@")[0] : "");
const isPaid = (s) => { const e = expiryOf(s); return !!e && Math.round((e - today0()) / 86400000) > 0; };
const activeList = () => students.filter((s) => !s.left);
const alertList = () => students.filter((s) => ["soon", "expired"].includes(expStatus(s).k));

// ---- Hisaab (income / kharcha / profit-loss) ----
// Fees income is counted in the month the money was actually received
const incomeOf = (m) => students.reduce((t, s) => t + entriesOf(s).reduce((u, e) => u + (payMonth(e) === m ? +e.amt || 0 : 0), 0), 0);
const payCountOf = (m) => students.reduce((t, s) => t + entriesOf(s).filter((e) => payMonth(e) === m).length, 0);
const monthExp = (m) => expenses.filter((e) => e.month === m);
const sumAmt = (arr) => arr.reduce((t, e) => t + (+e.amt || 0), 0);

function renderLogin() {
  $("app").innerHTML = `<div class="login"><div class="lcard">
    <h1>📚 Library Manager</h1>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div id="lerr" class="err"></div>
    <button class="btn pri" onclick="A.login()">Login</button>
    <button class="btn" onclick="A.forgot()">Forgot password?</button>
  </div></div>`;
}

function renderShell() {
  $("app").innerHTML = `<div id="top"></div><div id="content"></div>
  <button class="fab" onclick="A.fab()">+</button>
  <nav>
    <button data-t="home" onclick="A.setTab('home')"><span>🏠</span>Home</button>
    <button data-t="students" onclick="A.setTab('students')"><span>👥</span>Students</button>
    <button data-t="seats" onclick="A.setTab('seats')"><span>💺</span>Seats</button>
    <button data-t="kharcha" onclick="A.setTab('kharcha')"><span>💸</span>Expenses</button>
    <button data-t="more" onclick="A.setTab('more')"><span>⚙️</span>More</button>
  </nav>`;
  renderTop(); renderContent();
}

function renderTop() {
  if (!$("top")) return;
  const act = activeList();
  const unpaid = act.filter((s) => !isPaid(s));
  const collected = incomeOf(month), nPay = payCountOf(month);
  const pending = unpaid.reduce((t, s) => t + (+s.fee || 0), 0);
  $("top").innerHTML = `<div class="hdr">
    <div class="hrow"><h1>📚 Library Manager</h1>
      <div><span class="chip">${esc(myName())}</span> <button class="chip" onclick="A.logout()">Logout</button></div></div>
    <div class="mnav"><button onclick="A.month(-1)">‹</button><b>${labelOf(month)}</b><button onclick="A.month(1)">›</button></div>
    <div class="stats">
      <div class="stat"><small>Fees collected</small><b>₹${collected}</b><small>${nPay} payment${nPay === 1 ? "" : "s"}</small></div>
      <div class="stat"><small>Due now</small><b>₹${pending}</b><small>${unpaid.length} students</small></div>
    </div></div>`;
  const navTab = { history: "more", reminders: "home", attendance: "home" }[tab] || tab;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.t === navTab));
  const fab = document.querySelector(".fab");
  if (fab) fab.style.display = ["home", "students", "seats", "kharcha"].includes(tab) ? "" : "none";
}

function itemHtml(s) {
  const es = expStatus(s);
  const col = es.k === "expired" || es.k === "new" ? "red" : es.k === "soon" ? "amber" : "";
  return `<button class="item" onclick="A.detail('${s.id}')">
    <div class="av">${avatar(s)}<span class="sb">${isRes(s) ? s.seat : "UR"}</span></div>
    <div class="grow"><div class="nm">${esc(s.name)}</div>
      <div class="sub">${isRes(s) ? "" : "Unreserved • "}${esc(s.shift)} • ₹${s.fee}/month</div>
      <div class="sub ${s.left ? "" : col}">${s.left ? `Left on ${s.leftDate || ""}` : es.label}</div></div>
    ${s.left ? `<span class="pill l">Left</span>` : `<span class="pill ${isPaid(s) ? "p" : "u"}">${isPaid(s) ? "Paid ✓" : "Due"}</span>`}</button>`;
}

function getList() {
  const t = q.trim().toLowerCase();
  let arr = filter === "left" ? students.filter((s) => s.left) : filter === "expiring" ? alertList() : filter === "unres" ? activeList().filter((s) => !isRes(s)) : activeList();
  arr = arr.filter((s) => (filter === "paid" ? isPaid(s) : filter === "unpaid" ? !isPaid(s) : true))
    .filter((s) => !t || s.name.toLowerCase().includes(t) || (s.phone || "").includes(t) || (s.phone2 || "").includes(t) || (isRes(s) && String(s.seat) === t));
  return [...arr].sort((a, b) => filter === "expiring"
    ? expStatus(a).days - expStatus(b).days
    : (isRes(a) ? a.seat : 9999) - (isRes(b) ? b.seat : 9999) || a.name.localeCompare(b.name));
}

function renderList() {
  const el = $("list"); if (!el) return;
  const arr = getList();
  el.innerHTML = arr.length ? arr.map(itemHtml).join("") :
    `<div class="muted">${students.length ? "No students found." : "No students yet. Tap + to add the first student."}</div>`;
}

function seatState(n) {
  const on = activeList().filter((s) => s.seat === n);
  if (!on.length) return "vacant";
  return on.every(isPaid) ? "paid" : "unpaid";
}

function expItem(e) {
  return `<div class="item">
    <div class="grow" onclick="A.openExp('${e.id}')" style="cursor:pointer">
      <div class="nm">${esc(catEn(e.cat))}${e.payee ? " • " + esc(e.payee) : ""}</div>
      <div class="sub">${e.date}${e.note ? " • " + esc(e.note) : ""}</div>
      <div class="sub ${e.paid ? "green" : "amber"}">${e.paid ? "Paid ✓" : "To be paid"}</div></div>
    <div style="text-align:right"><b>${rs(e.amt)}</b>${e.paid ? "" : `<br><button class="btn ok sm" onclick="A.expPaid('${e.id}')">✓ Paid</button>`}</div>
  </div>`;
}

function renderKharcha(c) {
  const inc = incomeOf(month);
  const mex = monthExp(month).sort((a, b) => b.date.localeCompare(a.date));
  const spent = sumAmt(mex), given = sumAmt(mex.filter((e) => e.paid));
  const net = inc - spent;
  const pend = expenses.filter((e) => !e.paid).sort((a, b) => a.date.localeCompare(b.date));
  const cats = {};
  mex.forEach((e) => { cats[catEn(e.cat)] = (cats[catEn(e.cat)] || 0) + (+e.amt || 0); });
  const catRows = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  c.innerHTML = `<div class="pad">
    ${expErr ? `<div class="alert">⚠️ Expenses data is not loading/saving. Add permission for <b>expenses</b> in Firebase → Firestore → Rules.</div>` : ""}
    <div class="box" style="margin-top:0">
      <b>${labelOf(month)} summary</b>
      <div class="row"><span>Fees collected</span><b class="green">${rs(inc)}</b></div>
      <div class="row"><span>Total expenses</span><b class="red">${rs(spent)}</b></div>
      <div class="sub" style="text-align:right">Paid ${rs(given)} • Pending ${rs(spent - given)}</div>
      <div class="row" style="border-top:1px solid #e5e7eb;margin-top:6px;padding-top:10px">
        <b>${net >= 0 ? "Profit" : "Loss"}</b><b class="big ${net >= 0 ? "green" : "red"}">${rs(Math.abs(net))}</b></div>
    </div>
    ${pend.length ? `<div style="margin-top:16px"><b>💸 Payments still to be made (${rs(sumAmt(pend))})</b>
      <div style="margin-top:8px">${pend.map(expItem).join("")}</div></div>` : ""}
    ${catRows.length ? `<div class="box"><b style="font-size:14px">Spending by category</b>
      ${catRows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${rs(v)}</b></div>`).join("")}</div>` : ""}
    <div style="margin-top:16px"><b>${labelOf(month)} expenses</b>
      <div style="margin-top:8px">${mex.length ? mex.map(expItem).join("") : `<div class="muted">No expenses added this month.</div>`}</div></div>
    <button class="btn pri" onclick="A.openExp()">+ New expense</button>
  </div>`;
}

const bySeat = (a, b) => (isRes(a) ? a.seat : 9999) - (isRes(b) ? b.seat : 9999) || a.name.localeCompare(b.name);
const subHead = (title) => `<div class="subh"><button class="back" onclick="A.setTab('home')">‹ Home</button><b>${title}</b></div>`;
const waNum = (ph) => { const d = String(ph || "").replace(/\D/g, ""); return d.length === 10 ? "91" + d : d; };

function receiptLink(s, e) {
  const hiMode = e.mode === "Cash" ? "नकद" : e.mode === "UPI" ? "UPI" : e.mode;
  const en = `Thank you! We have received your fee of *₹${e.amt}* (${e.n} month${e.n > 1 ? "s" : ""}) on ${e.date} via ${e.mode}.\nPaid period: *${fmtY(e.from)} to ${fmtY(e.until)}*\nSeat: ${isRes(s) ? s.seat : "Unreserved"}`;
  const hi = `धन्यवाद! हमें आपकी *₹${e.amt}* की फीस (${e.n} माह) ${e.date} को ${hiMode} से प्राप्त हुई।\nअवधि: *${fmtHi(e.from)} से ${fmtHi(e.until)} तक*\nसीट: ${isRes(s) ? s.seat : "अनारक्षित"}`;
  const t = `*Fee Receipt — ${LIB}*\n\nDear ${s.name},\n${en}\n\n──────────\n\n*फीस रसीद — ${LIB_HI}*\n\nप्रिय ${s.name},\n${hi}\n\n— ${LIB} / ${LIB_HI}`;
  return `https://wa.me/${waNum(s.phone)}?text=${encodeURIComponent(t)}`;
}

function renderHome(c) {
  const act = activeList();
  const st = act.map(expStatus);
  const nSoon = st.filter((x) => x.k === "soon").length;
  const nExp = st.filter((x) => x.k === "expired" || x.k === "new").length;

  const nUn = act.filter((s) => !isRes(s)).length;
  const present = act.filter((s) => s.att && s.att[todayStr()]).length;
  const nLeft = students.filter((s) => s.left).length;
  const inc = incomeOf(month), spent = sumAmt(monthExp(month)), net = inc - spent;
  c.innerHTML = `<div class="pad">
    <div class="cards">
      <button class="card" onclick="A.setFilter('all')"><small>Active students</small><b>${act.length}</b></button>
      <button class="card" onclick="A.setTab('seats')"><small>Seats filled</small><b>${filled}/${totalSeats}</b><small>+ ${nUn} unreserved</small></button>
      <button class="card" onclick="A.setTab('reminders')"><small>Expiring in 3 days</small><b class="amber">${nSoon}</b></button>
      <button class="card" onclick="A.setTab('reminders')"><small>Expired / not paid</small><b class="red">${nExp}</b></button>
      <button class="card" onclick="A.setTab('attendance')"><small>Present today</small><b class="green">${present}</b><small>of ${act.length}</small></button>

    </div>
    <div class="box">
      <b>${labelOf(month)} summary</b>
      <div class="row"><span>Fees collected</span><b class="green">${rs(inc)}</b></div>
      <div class="row"><span>Expenses</span><b class="red">${rs(spent)}</b></div>
      <div class="row" style="border-top:1px solid #e5e7eb;margin-top:4px;padding-top:8px"><b>${net >= 0 ? "Profit" : "Loss"}</b><b class="big ${net >= 0 ? "green" : "red"}">${rs(Math.abs(net))}</b></div>
    </div>
    <button class="btn pri" onclick="A.setTab('reminders')">💬 Send fee reminders (${nSoon + nExp})</button>
    <button class="btn" onclick="A.setTab('attendance')">✅ Take attendance</button>
    <button class="btn" onclick="A.setTab('history')">🗓️ Month-wise summary</button>
  </div>`;
}

function renderReminders(c) {
  const arr = activeList().filter((s) => ["expired", "soon", "new"].includes(expStatus(s).k)).sort((a, b) => expStatus(a).days - expStatus(b).days);
  const tot = arr.reduce((t, s) => t + (+s.fee || 0), 0);
  c.innerHTML = `<div class="pad">${subHead("Fee reminders")}
    <div class="sub" style="margin-bottom:10px">${arr.length} student${arr.length === 1 ? "" : "s"} • ${rs(tot)} to collect. Tap Send, WhatsApp opens with the English + Hindi message.</div>

        <div class="grow" onclick="A.detail('${s.id}')"><div class="nm">${esc(s.name)}</div>
          <div class="sub ${col}">${es.label}</div>
          <div class="sub">${td ? "✓ Reminded today" : s.reminded ? "Last reminded: " + s.reminded : "Not reminded yet"}</div></div>
        ${s.phone ? `<a class="btn wa sm" href="${waLink(s)}" target="_blank" rel="noreferrer" onclick="A.reminded('${s.id}')">💬 Send</a>` : `<span class="sub">No phone</span>`}</div>`; }).join("")
      : `<div class="muted">🎉 No one has fees expiring or expired.</div>`}
  </div>`;
}

function renderAtt(c) {
  c.innerHTML = `<div class="pad">${subHead("Attendance")}
    <div class="two"><input id="adate" type="date" max="${todayStr()}" value="${attDate}" onchange="A.attDay(this.value)">
      <input id="aq" placeholder="Search name / seat" value="${esc(aq)}" oninput="A.attSearch(this.value)"></div>
    <div id="attsum" class="sub" style="margin:10px 0"></div>
    <div id="attlist"></div></div>`;
  renderAttList();
}
function renderAttList() {
  const el = $("attlist"); if (!el) return;
  const all = activeList(), t = aq.trim().toLowerCase();
  const arr = all.filter((s) => !t || s.name.toLowerCase().includes(t) || (isRes(s) && String(s.seat) === t)).sort(bySeat);

function renderContent() {
  const c = $("content"); if (!c) return;
  if (tab === "home") {
    renderHome(c);
  } else if (tab === "reminders") {
    renderReminders(c);
  } else if (tab === "attendance") {
    renderAtt(c);
  } else if (tab === "students") {
    const al = alertList();
    c.innerHTML = `<div class="pad">
      ${al.length ? `<button class="alert" onclick="A.setFilter('expiring')">⚠️ <b>${al.length} students</b> have fees expiring or already expired. Tap to view.</button>` : ""}
      <input id="q" placeholder="Search name / phone / seat no." value="${esc(q)}" oninput="A.search(this.value)">
      <div class="filters">${[["all", "All"], ["unpaid", "Due"], ["paid", "Paid"], ["expiring", "⚠ Expiring"], ["unres", "Unreserved"], ["left", "Left"]]

      <div id="list"></div></div>`;
    renderList();
  } else if (tab === "seats") {
    const act = activeList();
    const seats = Array.from({ length: totalSeats }, (_, i) => i + 1);
    const vac = seats.filter((n) => seatState(n) === "vacant").length;
    const unres = act.filter((s) => !isRes(s));
    const nameOf = (n) => {
      const on = act.filter((s) => s.seat === n);
      if (!on.length) return "";
      const f = esc(on[0].name.trim().split(/\s+/)[0]);
      return on.length > 1 ? `${f} +${on.length - 1}` : f;
    };
    c.innerHTML = `<div class="pad">
      <div class="sub" style="margin-bottom:10px">🟩 Paid &nbsp; 🟥 Due &nbsp; ⬜ Vacant</div>
      <div class="grid">${seats.map((n) => `<button class="sbtn ${seatState(n)}" onclick="A.seat(${n})">${n}<small>${nameOf(n)}</small></button>`).join("")}</div>
      <button class="item" style="margin-top:14px" onclick="A.setFilter('unres')">
        <div class="seatbox"><small>SEAT</small><b>UR</b></div>
        <div class="grow"><div class="nm">Unreserved students</div><div class="sub">Students without a fixed seat — tap to see the list</div></div>
        <b>${unres.length}</b></button>
      <div class="muted">Tap a vacant seat = new student. Tap an occupied seat = details.<br>Vacant seats: ${vac} / ${totalSeats}</div></div>`;
  } else if (tab === "kharcha") {
    renderKharcha(c);
  } else if (tab === "history") {
    const map = {};
    const row = (m) => (map[m] = map[m] || { m, n: 0, inc: 0, exp: 0 });
    students.forEach((s) => entriesOf(s).forEach((e) => { const r = row(payMonth(e)); r.n++; r.inc += +e.amt || 0; }));
    expenses.forEach((e) => { row(e.month).exp += +e.amt || 0; });
    const rows = Object.values(map).sort((a, b) => b.m.localeCompare(a.m));
    const tot = rows.reduce((t, r) => t + r.inc - r.exp, 0);
    c.innerHTML = `<div class="pad">${subHead("Month-wise summary")}
      ${rows.length ? `<div class="sub">Total ${tot >= 0 ? "profit" : "loss"} so far: <b class="${tot >= 0 ? "green" : "red"}">${rs(Math.abs(tot))}</b></div>` : ""}
      <div style="margin-top:10px">
      ${rows.length ? rows.map((r) => { const net = r.inc - r.exp; return `<button class="item" onclick="A.goMonth('${r.m}')">
        <div class="grow"><div class="nm">${labelOf(r.m)}</div>
          <div class="sub">Fees ${rs(r.inc)} (${r.n} payment${r.n === 1 ? "" : "s"}) • Expenses ${rs(r.exp)}</div></div>
        <div style="text-align:right"><b class="${net >= 0 ? "green" : "red"}">${rs(Math.abs(net))}</b><div class="sub">${net >= 0 ? "Profit" : "Loss"}</div></div></button>`; }).join("") : `<div class="muted">No records yet.</div>`}
      </div><div class="muted">Tap a month to see its full list.</div></div>`;
  } else {
    c.innerHTML = `<div class="pad">
      <div class="box" style="margin-top:0"><b>Tools</b>
        <button class="btn" onclick="A.setTab('attendance')">✅ Attendance</button>
        <button class="btn" onclick="A.setTab('reminders')">💬 Fee reminders</button>
        <button class="btn" onclick="A.setTab('history')">🗓️ Month-wise summary</button>
        <button class="btn" onclick="A.setFilter('left')">🚪 Left students</button></div>
      <div class="box"><b>Download</b>
        <button class="btn" onclick="A.csv()">⬇ Students CSV (as of today)</button>
        <button class="btn" onclick="A.csvExp()">⬇ ${labelOf(month)} expenses CSV</button>
        <button class="btn" onclick="A.backup()">💾 Full backup (all data)</button>
        <div class="sub" style="margin-top:6px">Download a backup once in a while and keep it safe (Drive / WhatsApp to yourself).</div></div>
      <div class="box"><b>Account</b>
        <button class="btn" onclick="A.openPw()">🔑 Change password</button></div>
      ${isOwner() ? `<div class="box"><b>Total seats</b>
        <input type="number" value="${totalSeats}" onchange="A.setSeats(this.value)" style="margin-top:8px"></div>` : ""}
      <div class="muted">Login: ${esc(user.email)} (${isOwner() ? "Owner" : "Staff"})<br>Data syncs live across all devices.</div></div>`;
  }
}

function waLink(s) {
  const ph = (s.phone || "").replace(/\D/g, "");
  const e = expiryOf(s), es = expStatus(s);
  const seatEn = isRes(s) ? `Seat ${s.seat}` : "Unreserved seat";
  const seatHi = isRes(s) ? `सीट ${s.seat}` : "अनारक्षित सीट";
  const fee = `₹${s.fee}`;
  let en, hi;
  if (e && es.k === "expired") {
    en = `This is a courtesy reminder from *${LIB}*. Your membership (${seatEn}) expired on *${fmtY(e)}*. To continue using your seat, kindly renew your fee of ${fee} at the earliest.`;
    hi = `*${LIB_HI}* की ओर से सूचना: आपकी सदस्यता (${seatHi}) *${fmtHi(e)}* को समाप्त हो चुकी है। अपनी सीट जारी रखने के लिए कृपया ${fee} की फीस शीघ्र जमा करें।`;
  } else if (e && es.k === "soon") {
    const w = es.days === 0 ? "today" : `on ${fmtY(e)}`;
    const wh = es.days === 0 ? "आज" : `${fmtHi(e)} को`;
    en = `This is a courtesy reminder from *${LIB}*. Your membership (${seatEn}) expires *${w}*. Kindly renew your fee of ${fee} to continue without interruption.`;
    hi = `*${LIB_HI}* की ओर से सूचना: आपकी सदस्यता (${seatHi}) *${wh}* समाप्त हो रही है। बिना रुकावट सीट जारी रखने के लिए कृपया ${fee} की फीस जमा करें।`;
  } else {
    en = `This is a courtesy reminder from *${LIB}*. Your fee of ${fee} (${seatEn}) is pending. Kindly clear the payment at your earliest convenience.`;
    hi = `*${LIB_HI}* की ओर से सूचना: आपकी ${fee} की फीस (${seatHi}) बकाया है। कृपया शीघ्र भुगतान करें।`;
  }
  const t = `Dear ${s.name},\n\n${en}\n\nThank you.\n— ${LIB}\n\n──────────\n\nप्रिय ${s.name},\n\n${hi}\n\nधन्यवाद।\n— ${LIB_HI}`;
  return `https://wa.me/${ph.length === 10 ? "91" + ph : ph}?text=${encodeURIComponent(t)}`;
}

      ${groups.length ? groups.map((e) => `<div class="hist"><span>${fmt(e.from)} → ${fmtY(e.until)}</span><span class="sub">₹${e.amt} • ${esc(e.mode)} • ${e.date}${e.n > 1 ? ` • ${e.n} months` : ""}</span></div>`).join("") : `<div class="sub">No payments yet.</div>`}

    <div class="field"><input id="fn" placeholder="Name" value="${esc(s ? s.name : "")}"></div>
    <div class="field"><input id="fp" placeholder="Phone number" inputmode="numeric" value="${esc(s ? s.phone : "")}"></div>
    <div class="field"><input id="fp2" placeholder="Alternate / parent phone (optional)" inputmode="numeric" value="${esc(s ? s.phone2 : "")}"></div>
    <div class="field"><input id="fa" placeholder="Aadhaar number (12 digits, optional)" inputmode="numeric" maxlength="14" oninput="A.fmtAad(this)" value="${esc(s && s.aadhaar ? fullAad(s.aadhaar) : "")}"></div>
    <div class="field"><label>Seat type</label>
      <select id="ft" onchange="A.seatType()">
        <option value="r" ${unres ? "" : "selected"}>Reserved (fixed seat)</option>
        <option value="u" ${unres ? "selected" : ""}>Unreserved (any seat)</option>
      </select></div>
    <div class="two field"><input id="fs" type="number" placeholder="Seat no." value="${s ? (isRes(s) ? s.seat : "") : seat || ""}">
      <input id="ff" type="number" placeholder="Monthly fees ₹" value="${s ? s.fee : ""}"></div>
    <div class="field"><select id="fh">${SHIFTS.map((x) => `<option ${s && s.shift === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label>Admission date</label>
      <input id="fd" type="date" value="${s ? s.joinDate : todayStr()}"></div>
    <div class="field"><input id="fnote" placeholder="Note (optional) e.g. exam, college, address" value="${esc(s ? s.note : "")}"></div>
    <div id="ferr" class="err"></div>
    <button class="btn pri" onclick="A.save('${id || ""}')">Save</button>
  </div></div>`;
  A.seatType();
}

function renderExpForm(id) {
  const e = id ? expenses.find((x) => x.id === id) : null;
  formOpen = true; detailId = null;
  $("modal").innerHTML = `<div class="overlay"><div class="sheet">
    <button class="close" onclick="A.closeModal()">×</button>
    <h2>${e ? "Edit expense" : "New expense"}</h2>
    <div class="field"><label>What is the expense for?</label>
      <select id="ec">${CATS.map((x) => `<option ${e && catEn(e.cat) === x ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div class="two field"><input id="ea" type="number" inputmode="decimal" placeholder="Amount ₹" value="${e ? e.amt : ""}">
      <input id="ed" type="date" value="${e ? e.date : todayStr()}"></div>
    <div class="field"><input id="ep" placeholder="Paid to / to be paid to (name)" value="${esc(e ? e.payee : "")}"></div>
    <div class="field"><input id="en" placeholder="Note (optional)" value="${esc(e ? e.note : "")}"></div>
    <div class="field"><select id="es">
      <option value="1" ${!e || e.paid ? "selected" : ""}>✓ Payment done</option>
      <option value="0" ${e && !e.paid ? "selected" : ""}>⏳ Still to be paid</option></select></div>
    <div id="ferr" class="err"></div>
    <button class="btn pri" onclick="A.saveExp('${id || ""}')">Save</button>
    ${e ? `<button class="btn del" onclick="A.delExp('${id}')">🗑 Delete</button>` : ""}
  </div></div>`;
}

function renderPwForm() {
  formOpen = true; detailId = null;
  $("modal").innerHTML = `<div class="overlay"><div class="sheet">
    <button class="close" onclick="A.closeModal()">×</button>
    <h2>Change password</h2>
    <div class="field"><input id="po" type="password" placeholder="Old password" autocomplete="current-password"></div>
    <div class="field"><input id="pn" type="password" placeholder="New password (at least 6 characters)" autocomplete="new-password"></div>
    <div class="field"><input id="pc" type="password" placeholder="Re-enter new password" autocomplete="new-password"></div>
    <div id="ferr" class="err"></div>
    <button class="btn pri" onclick="A.changePw()">Change password</button>
  </div></div>`;
}

function refreshUI() {
  if (!user) return;
  renderTop();
  if (tab === "attendance" && $("attlist")) renderAttList();
  else if (document.activeElement && document.activeElement.id === "q") renderList();
  else renderContent();
  if (detailId && !formOpen) renderDetail();
}

function download(rows, name) {
  const csv = rows.map((r) => r.map((c) => `"${c ?? ""}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
  a.download = name; a.click();
}

const A = {
  login: async () => {
    try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
    catch (e) { $("lerr").style.color = ""; $("lerr").textContent = "Incorrect email or password"; }
  },
  forgot: async () => {
    const em = $("em").value.trim(), el = $("lerr");
    el.style.color = "";
    if (!em) { el.textContent = "Enter your email above first, then tap 'Forgot password?'"; return; }
    try {
      await sendPasswordResetEmail(auth, em);
      el.style.color = "#15803d";
      el.textContent = "Password reset link sent to your email. Check your inbox or spam folder.";
    } catch (e) { el.textContent = "Couldn't send the link. Is the email correct? Check your internet."; }
  },
  openPw: () => renderPwForm(),
  changePw: async () => {
    const err = (m, ok) => { const e = $("ferr"); e.textContent = m; e.style.color = ok ? "#15803d" : ""; };
    const o = $("po").value, n = $("pn").value, c = $("pc").value;
    if (!o) return err("Enter your old password");
    if (n.length < 6) return err("New password must be at least 6 characters");
    if (n !== c) return err("The new passwords do not match");
    if (n === o) return err("New password must differ from the old one");
    try {
      await reauthenticateWithCredential(auth.currentUser, EmailAuthProvider.credential(auth.currentUser.email, o));
      await updatePassword(auth.currentUser, n);
      err("Password changed ✓", true);
      setTimeout(A.closeModal, 1500);
    } catch (e) {
      const bad = ["auth/wrong-password", "auth/invalid-credential", "auth/invalid-login-credentials"].includes(e.code);
      err(bad ? "Old password is incorrect" : "Password not changed. Check your internet or try again later.");
    }
  },
  logout: () => signOut(auth),
  setTab: (t) => { tab = t; if (t === "students") q = ""; renderTop(); renderContent(); },
  fab: () => { if (tab === "kharcha") A.openExp(); else A.openForm(); },
  month: (n) => { month = shiftYm(month, n); refreshUI(); },
  goMonth: (m) => { month = m; filter = "all"; tab = "students"; renderTop(); renderContent(); },
  setFilter: (f) => { filter = f; q = ""; tab = "students"; renderTop(); renderContent(); },
  search: (v) => { q = v; renderList(); },
  seat: (n) => {
    if (seatState(n) === "vacant") A.openForm(n);
    else { q = String(n); filter = "all"; tab = "students"; renderTop(); renderContent(); }
  },
  detail: (id) => { detailId = id; formOpen = false; flash = null; renderDetail(); },
  closeModal: () => { $("modal").innerHTML = ""; detailId = null; formOpen = false; flash = null; },
  openForm: (seat, id) => renderForm(seat, id),
  fmtAad: (el) => { el.value = el.value.replace(/\D/g, "").slice(0, 12).replace(/(\d{4})(?=\d)/g, "$1 "); },
  pickPhoto: async (inp) => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    try {
      formPhoto = await shrink(file);
      $("pv").innerHTML = avatar({ name: $("fn").value, photo: formPhoto }, 64);
      $("ferr").textContent = "";
    } catch (e) { $("ferr").textContent = "Could not load the photo. Try another one."; }
  },
  rmPhoto: () => { formPhoto = ""; $("pv").innerHTML = avatar({ name: $("fn").value, photo: "" }, 64); },
  zoom: (id) => {
    const s = students.find((x) => x.id === id);
    if (!s || !s.photo) return;
    $("zoom").innerHTML = `<div class="overlay" onclick="document.getElementById('zoom').innerHTML=''"><img src="${s.photo}" alt=""></div>`;
  },
  toggleAad: (id) => {
    const s = students.find((x) => x.id === id), el = $("aad");
    if (!s || !el) return;
    const show = el.dataset.on !== "1";
    el.dataset.on = show ? "1" : "0";
    el.textContent = show ? fullAad(s.aadhaar) : maskAad(s.aadhaar);
  },
  seatType: () => {
    const u = $("ft").value === "u";
    $("fs").disabled = u;
    $("fs").style.opacity = u ? 0.4 : 1;
    if (u) $("fs").value = "";
  },
  save: async (id) => {
    const un = $("ft").value === "u";
    const aad = $("fa").value.replace(/\D/g, "");
    const f = { name: $("fn").value.trim(), phone: $("fp").value.trim(), phone2: $("fp2").value.trim(), note: $("fnote").value.trim(), aadhaar: aad, photo: formPhoto, seat: un ? 0 : +$("fs").value, fee: +$("ff").value, shift: $("fh").value, joinDate: $("fd").value };
    const err = (m) => { $("ferr").textContent = m; };
    if (!f.name) return err("Enter a name");
    if (aad && aad.length !== 12) return err("Aadhaar number must be 12 digits");
    if (!un && (!f.seat || f.seat < 1 || f.seat > totalSeats)) return err(`Seat must be between 1 and ${totalSeats}`);
    if (!f.fee) return err("Enter the fees");
    if (!f.joinDate) return err("Choose the admission date");
    const cur = id ? students.find((s) => s.id === id) : null;
    const clash = !un && !(cur && cur.left) && students.find((s) => s.id !== id && !s.left && conflict(s, f));
    if (clash) return err(`Seat ${f.seat} (${clash.shift}) is already taken by ${clash.name}`);
    try {
      if (id) await updateDoc(doc(db, "students", id), f);
      else await addDoc(collection(db, "students"), { ...f, payments: {} });
      A.closeModal();
    } catch (e) { err("Could not save. Check your internet."); }
  },
  planChg: (id) => {
    const s = students.find((x) => x.id === id), n = +$("pmn").value || 1;
    $("pamt").value = (+s.fee || 0) * n;
    $("pcov").textContent = planText(planPay(s, n, $("pdate").value || todayStr()));
  },
  pay: async (id) => {
    const s = students.find((x) => x.id === id);
    const n = +$("pmn").value || 1;
    const date = $("pdate").value || todayStr();
    const amt = +$("pamt").value || +s.fee * n;
    const pl = planPay(s, n, date);
    if (!confirm(`Receive ₹${amt} from ${s.name}?\nThis covers ${planText(pl)}.`)) return;
    const entry = { id: String(Date.now()), from: ymd(pl.from), until: ymd(pl.until), months: n, day: pl.day, amt, mode: $("pmode").value, date, by: myName() };
    try { await updateDoc(doc(db, "students", id), { pays: [...(s.pays || []), entry] }); flash = id; renderDetail(); }
    catch (e) { $("perr").textContent = "Could not save. Check your internet."; }
  },
  undo: async (id) => {
    const s = students.find((x) => x.id === id);
    const ents = entriesOf(s);
    if (!ents.length) return;
    const g = ents[ents.length - 1];
    if (!confirm(`Undo the payment of ₹${g.amt} received on ${g.date}?`)) return;
    try {
      if (g.legacy) {
        const args = [];
        for (let i = 0; i < g.n; i++) {
          const k = shiftYm(g.k, i);
          if (s.payments[k] && (s.payments[k].start || k) === (s.payments[g.k].start || g.k)) args.push(new FieldPath("payments", k), deleteField());
        }
        await updateDoc(doc(db, "students", id), ...args);
      } else {
        await updateDoc(doc(db, "students", id), { pays: (s.pays || []).filter((p) => p.id !== g.id) });
      }
      A.closeModal();
    } catch (e) { alert("Could not save. Check your internet."); }
  },
  leave: async (id) => {
    const s = students.find((x) => x.id === id);
    if (!confirm(`Mark ${s.name} as left? The seat will become free. You can restore the student later.`)) return;
    try { await updateDoc(doc(db, "students", id), { left: true, leftDate: todayStr() }); A.closeModal(); }
    catch (e) { alert("Could not save. Check your internet."); }
  },
  rejoin: async (id) => {
    const s = students.find((x) => x.id === id);
    const clash = isRes(s) && students.find((o) => o.id !== id && !o.left && conflict(o, s));
    if (clash) return alert(`Seat ${s.seat} (${clash.shift}) is now taken by ${clash.name}. Edit this student and choose another seat first.`);
    try { await updateDoc(doc(db, "students", id), { left: false, leftDate: "" }); }
    catch (e) { alert("Could not save. Check your internet."); }
  },
  reminded: (id) => { updateDoc(doc(db, "students", id), { reminded: todayStr() }).catch(() => {}); },
  attDay: (v) => { attDate = v || todayStr(); renderAttList(); },
  attSearch: (v) => { aq = v; renderAttList(); },
  mark: async (id) => {
    const s = students.find((x) => x.id === id);
    const on = s.att && s.att[attDate];
    const t = attDate === todayStr() ? new Date().toTimeString().slice(0, 5) : "✓";
    try { await updateDoc(doc(db, "students", id), new FieldPath("att", attDate), on ? deleteField() : t); }
    catch (e) { alert("Could not save. Check your internet."); }
  },
  backup: () => {
    const data = { app: LIB, exportedOn: todayStr(), totalSeats, students, expenses };
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
    a.download = `library-backup-${todayStr()}.json`; a.click();
  },
  remove: async (id) => {
    if (!confirm("Delete this student? Their entire record will be lost.")) return;
    await deleteDoc(doc(db, "students", id));
    A.closeModal();
  },
  // ---- Kharcha ----
  openExp: (id) => renderExpForm(id),
  saveExp: async (id) => {
    const err = (m) => { $("ferr").textContent = m; };
    const amt = +$("ea").value, date = $("ed").value, paid = $("es").value === "1";
    if (!amt || amt <= 0) return err("Enter the amount");
    if (!date) return err("Choose the date");
    const old = id ? expenses.find((x) => x.id === id) : null;
    const f = {
      cat: $("ec").value, amt, date, month: date.slice(0, 7),
      payee: $("ep").value.trim(), note: $("en").value.trim(), paid,
      paidDate: paid ? (old && old.paid && old.paidDate) || todayStr() : "",
      by: (old && old.by) || myName()
    };
    try {
      if (id) await updateDoc(doc(db, "expenses", id), f);
      else await addDoc(collection(db, "expenses"), f);
      A.closeModal();
    } catch (e) { err("Could not save. Check your internet or Firestore Rules."); }
  },
  expPaid: async (id) => {
    try { await updateDoc(doc(db, "expenses", id), { paid: true, paidDate: todayStr() }); }
    catch (e) { alert("Could not save. Check your internet or Firestore Rules."); }
  },
  delExp: async (id) => {
    if (!confirm("Delete this expense?")) return;
    await deleteDoc(doc(db, "expenses", id));
    A.closeModal();
  },
  setSeats: async (v) => { await setDoc(doc(db, "settings", "main"), { totalSeats: Math.max(1, +v || 1) }); },
  csv: () => {
    const rows = [["Seat", "Name", "Phone", "Shift", "Fees", "Status", "Expiry", "Last paid", "Mode", "Paid on", "Received by"]];
    [...activeList()].sort((a, b) => (isRes(a) ? a.seat : 9999) - (isRes(b) ? b.seat : 9999)).forEach((s) => {
      const g = entriesOf(s).pop(), e = expiryOf(s);
      rows.push([isRes(s) ? s.seat : "Unreserved", s.name, s.phone, s.shift, s.fee, isPaid(s) ? "Paid" : "Due", e ? fmtY(e) : "", g ? g.amt : "", g ? g.mode : "", g ? g.date : "", g ? g.by || "" : ""]);
    });
    download(rows, `students-${todayStr()}.csv`);
  },
  csvExp: () => {
    const rows = [["Date", "Category", "Paid to", "Note", "Amount", "Status", "Paid on"]];
    monthExp(month).sort((a, b) => a.date.localeCompare(b.date)).forEach((e) => {
      rows.push([e.date, catEn(e.cat), e.payee, e.note, e.amt, e.paid ? "Paid" : "Pending", e.paidDate || ""]);
    });
    const inc = incomeOf(month), spent = sumAmt(monthExp(month));
    rows.push([], ["", "Fees collected", "", "", inc], ["", "Total expenses", "", "", spent], ["", inc - spent >= 0 ? "Profit" : "Loss", "", "", Math.abs(inc - spent)]);
    download(rows, `expenses-${month}.csv`);
  }
};
window.A = A;

onAuthStateChanged(auth, (u) => {
  user = u;
  if (unsubS) { unsubS(); unsubS = null; }
  if (unsubC) { unsubC(); unsubC = null; }
  if (unsubE) { unsubE(); unsubE = null; }
  $("modal").innerHTML = "";
  if (!u) { students = []; expenses = []; renderLogin(); return; }
  renderShell();
  unsubS = onSnapshot(collection(db, "students"), (snap) => {
    students = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    refreshUI();
  });
  unsubC = onSnapshot(doc(db, "settings", "main"), (s) => {
    totalSeats = s.exists() ? Math.max(100, s.data().totalSeats || 100) : 100;
    refreshUI();
  });
  unsubE = onSnapshot(collection(db, "expenses"), (snap) => {
    expErr = false;
    expenses = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    refreshUI();
  }, () => { expErr = true; refreshUI(); });
});
</script>
</body>
</html>
